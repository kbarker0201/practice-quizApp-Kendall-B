<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="script.js" defer></script>
        <title>Form Page</title>
    </head>
    <body>
        <header>
            <h1>Quiz Time!</h1>
        </header>
        <main>
            <div>
                <p id="question">Question Text</p>
            </div>
            <div>
                <button class="choice-buttons">Option 1</button>
                <button class="choice-buttons">Option 2</button>
                <button class="choice-buttons">Option 3</button>
                <button class="choice-buttons">Option 4</button>
            </div>
            <div>
                <p id="result">Find out if right</p>
            </div>
            <div>
                <button id="next-question">Next Question</button>
            </div>
        </main>
    </body>
    <footer>
        &copy 2025 Quiz App
    </footer>
</html>
